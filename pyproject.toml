[project]
name = "bookly-support"
version = "0.1.0"
description = "Bookly bookstore customer support agent"
readme = "README.md"
requires-python = "==3.12.14"
dependencies = [
    "fastapi==0.142.1",
    "fpdf2==2.8.4",
    "pydantic-ai==2.48.0",
    "pymongo==4.15.3",
    "uvicorn==0.54.0",
]

[project.scripts]
bookly-support = "bookly_support:main"

[build-system]
requires = ["uv_build==0.12.21"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls Atlas and Claude; skipped when those secrets are not in the environment",
]
